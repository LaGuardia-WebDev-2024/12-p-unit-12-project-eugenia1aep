<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Unit 12 Project</title>
    <link href="style.css" rel="stylesheet" type="text/css" />
  </head>
  <body>
    <button id="mem1-button">Memory #1</button>
    <button id="mem2-button">Memory #2</button>
    <button id="mem3-button">Memory #3</button>

    <h1 class="heading">My Top 3 Memories of <span>This Year</span></h1>

    <ol>
      <li>
        <h3 id="mem1">Memory #1</h3>
        <p>my boyfriend gifting me flowers, ceramic cats and a ring</p>
        <img
          src="https://media.discordapp.net/attachments/811394064943546369/1368031041595510935/IMG_0389.jpg?ex=6816bdb1&is=68156c31&hm=a5256da259a1960f3dce62fe49499be7b196206c70f5fd3c03409a80fc79cf24&=&format=webp&width=486&height=648" alt="Memory 1 image"/>
      </li>

      <li>
        <h3 id="mem2">Memory #2</h3>
        <p>got a new phone with my own earned money</p>
        <img src="https://media.discordapp.net/attachments/811394064943546369/1368032605177385071/camphoto_1932422408.jpg?ex=6816bf25&is=68156da5&hm=f435d16106d5dfd543f7f6b203ee14ff503b55734c7779fc7399c55f923d84ed&=&format=webp&width=486&height=648" alt="Memory 2 image" />
      </li>

      <li>
        <h3 id="mem3">Memory #3</h3>
        <p>got plane tickets and went to my home country</p>
        <img src="https://media.discordapp.net/attachments/811394064943546369/1368034821649072178/image0.jpg?ex=6816c136&is=68156fb6&hm=24d5f07d4d91f92af44893f153ec70a3a6bd86be1d3179faed187738b3acc93e&=&format=webp" style="width: 400px; height: auto;" alt="Memory 3 image" />
      </li>
    </ol>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/2.1.4/jquery.min.js"></script>
    <script>
      $("#mem1-button").click(function () {
        $("#mem1").css("color", "purple");
        $("h1").addClass("highlight");
      });

      $("#mem2-button").click(function () {
        $("#mem2").css("color", "blue");
      });

      $("#mem3-button").click(function () {
        $("#mem3").css("color", "green");
      });
    </script>
  </body>
</html>
